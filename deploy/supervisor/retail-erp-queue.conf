; Queue worker for jobs dispatched by Sales/Purchases/Notification/etc.
; (event listeners posting journal entries, sending notifications, and
; the offline-sale-outbox sync all run through the default queue).
;
; Install: copy to /etc/supervisor/conf.d/, then:
;   supervisorctl reread && supervisorctl update && supervisorctl start retail-erp-queue:*

[program:retail-erp-queue]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/retail-erp/artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
directory=/var/www/retail-erp
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/retail-erp/storage/logs/queue-worker.log
stopwaitsecs=3600
