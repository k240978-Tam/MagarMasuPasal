; Reverb WebSocket server — powers the live Cashier POS / Customer Display
; sync and the Owner/Manager dashboard tiles (docs/architecture/06-api-design.md
; §6.4). Exactly one process; Reverb is not designed to run multiple
; instances behind a load balancer without a shared pub/sub backplane.
;
; Install: copy to /etc/supervisor/conf.d/, then:
;   supervisorctl reread && supervisorctl update && supervisorctl start retail-erp-reverb

[program:retail-erp-reverb]
command=php /var/www/retail-erp/artisan reverb:start --host=127.0.0.1 --port=8080
directory=/var/www/retail-erp
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/retail-erp/storage/logs/reverb.log
